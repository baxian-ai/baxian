name: npm publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Validate package only, do not publish to npm"
        type: boolean
        default: true
      test-run-id:
        description: "Successful public main test run for this commit"
        type: string
        required: true
  repository_dispatch:
    types:
      - npm-publish

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dry-run: ${{ steps.publish-mode.outputs.dry-run }}

    steps:
      - name: Ensure public release repository
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GH_REPOSITORY" != "baxian-ai/baxian" ]; then
            echo "npm publish workflow is only allowed in baxian-ai/baxian."
            exit 1
          fi

      - name: Resolve publish mode
        id: publish-mode
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DRY_RUN: ${{ inputs['dry-run'] }}
          DISPATCH_DRY_RUN: ${{ github.event.client_payload.dry_run }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_dispatch)
              dry_run="${WORKFLOW_DRY_RUN:-true}"
              ;;
            repository_dispatch)
              if [ "$EVENT_ACTION" != "npm-publish" ]; then
                echo "Unsupported repository_dispatch action: $EVENT_ACTION"
                exit 1
              fi
              dry_run="$DISPATCH_DRY_RUN"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          if [ "$dry_run" != "true" ] && [ "$dry_run" != "false" ]; then
            echo "dry-run must be true or false, got: $dry_run"
            exit 1
          fi

          echo "dry-run=$dry_run" >> "$GITHUB_OUTPUT"

  validate:
    needs: validate-repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      artifact-id: ${{ steps.verified-artifact.outputs.artifact-id }}
      test-run-id: ${{ steps.artifact.outputs.test-run-id }}
      test-run-attempt: ${{ steps.artifact.outputs.test-run-attempt }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Verify and download tested release
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BAXIAN_TEST_RUN_ID: ${{ inputs['test-run-id'] || github.event.client_payload.test_run_id }}
          BAXIAN_PUBLIC_SHA: ${{ github.event.client_payload.public_sha }}
        run: node scripts/release-artifact.mjs

      - uses: actions/upload-artifact@v7
        id: verified-artifact
        with:
          name: baxian-tarball-${{ github.run_attempt }}
          path: release-package/baxian-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ needs.validate-repository.outputs.dry-run == 'false' && github.ref == 'refs/heads/main' && github.repository == 'baxian-ai/baxian' }}
    needs:
      - validate-repository
      - validate
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install -g npm@11.18.0

      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          merge-multiple: true
          path: .

      - name: Check version is unpublished
        env:
          TARBALL_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(baxian-*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one baxian tarball, found ${#tarballs[@]}."
            exit 1
          fi
          node --input-type=module - "${tarballs[0]}" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const actual = createHash('sha256').update(readFileSync(process.argv[2])).digest('hex');
          if (actual !== process.env.TARBALL_SHA256) throw new Error('release tarball digest mismatch');
          NODE
          version="$(tar -xOf "${tarballs[0]}" package/package.json | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).version));')"
          if npm view "baxian@$version" version >/dev/null 2>&1; then
            echo "baxian@$version already exists on npm."
            exit 1
          fi

      - name: Publish tarball to npm
        env:
          GH_TOKEN: ${{ github.token }}
          BAXIAN_PUBLIC_SHA: ${{ github.sha }}
          BAXIAN_TEST_RUN_ID: ${{ needs.validate.outputs.test-run-id }}
          BAXIAN_TEST_RUN_ATTEMPT: ${{ needs.validate.outputs.test-run-attempt }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(baxian-*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one baxian tarball, found ${#tarballs[@]}."
            exit 1
          fi
          node scripts/release-artifact.mjs --verify-run
          npm publish "${tarballs[0]}"
